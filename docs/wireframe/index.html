<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Baby Cry · Low-Fi Wireframe</title><style>
*{box-sizing:border-box}body{margin:0;background:#dedede;color:#242424;font:15px/1.6 Arial,Tahoma,sans-serif}button,input{font:inherit}button{cursor:pointer;background:white;border:1px solid #aaa;border-radius:8px;padding:13px 16px;color:inherit}button:disabled{opacity:.4;cursor:default}.primary{background:#333;color:white;border-color:#333}.phone{width:100%;max-width:430px;height:100dvh;min-height:600px;margin:auto;background:#fafafa;display:flex;flex-direction:column;position:relative;overflow:hidden}.top{height:58px;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #ddd}.top button{padding:3px 11px;font-size:22px}.top span{font-size:12px;color:#777;margin-left:auto}.content{flex:1;overflow:auto;padding:25px 24px}.center{text-align:center}h1{font-size:23px;line-height:1.45;margin:12px 0}h2{font-size:17px;margin:0 0 8px}p{margin:8px 0;color:#666}.placeholder{height:164px;width:164px;margin:30px auto;border:1px dashed #999;background:#eee;display:grid;place-content:center;color:#777}.placeholder small{font-size:12px}.footer{padding:16px 24px 25px;border-top:1px solid #ddd;display:flex;gap:10px;background:#fafafa}.footer button{flex:1}.tag{display:inline-block;border:1px solid #aaa;padding:4px 12px;border-radius:5px;font-size:12px}.card{border:1px solid #bbb;border-radius:8px;padding:16px;margin-top:16px;background:#fff}.card p{font-size:14px}.mic{border:1px solid #888;border-radius:50%;width:94px;height:94px;margin:25px auto 15px;font-size:16px;display:grid;place-content:center;background:#eee}.wave{height:110px;display:flex;align-items:center;justify-content:center;gap:4px;margin:20px 0}.wave i{width:4px;background:#777;animation:wave .7s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-0.09s)}@keyframes wave{from{height:8px}to{height:var(--h)}}.timer{font-size:28px;letter-spacing:3px}.steps{font-size:12px;color:#888;margin-bottom:24px}.spinner{width:58px;height:58px;border:3px solid #ddd;border-top-color:#555;border-radius:50%;animation:spin 1s linear infinite;margin:70px auto 28px}@keyframes spin{to{transform:rotate(360deg)}}.overlay{position:absolute;inset:0;background:#0006;display:grid;align-items:center;padding:24px;z-index:2}.dialog{background:white;border:1px solid #aaa;border-radius:12px;padding:22px}.dialog .actions{display:flex;gap:8px;margin-top:22px}.dialog button{flex:1;font-size:13px}.bubble{padding:14px;background:#eee;border:1px solid #ccc;border-radius:8px;margin:12px 0}.bubble.user{margin-left:40px;background:white}.chat-form{display:flex;gap:8px;width:100%}input{min-width:0;flex:1;border:1px solid #aaa;padding:10px;border-radius:6px}.note{font-size:12px;color:#777}.saved{padding:10px;border:1px dashed #999;margin-top:16px}.hidden{display:none}@media(min-width:500px){.phone{height:calc(100dvh - 32px);margin:16px auto;border:1px solid #aaa;border-radius:20px}}
.home-content{display:flex;flex-direction:column;padding-top:32px;padding-bottom:48px}.home-content>.center{display:flex;flex:1;flex-direction:column;align-items:center}.home-action{margin-top:auto;padding-top:40px}.home-action .mic{margin:0 auto 14px}.home-action p{font-size:14px;margin:0}@media(max-height:700px){.home-content{padding-bottom:28px}}
.loading-content{display:flex;align-items:center;justify-content:center}.loading-content .spinner{margin:0 auto 24px}.loading-content h1{font-size:20px}
.baby-image{width:96px;height:96px;border:1px dashed #aaa;border-radius:50%;background:#eee;margin:8px auto 24px}
.chat-content{padding:20px 16px;min-height:0}.chat-content #messages{display:flex;flex-direction:column;gap:16px}.chat-content .bubble{align-self:flex-start;max-width:82%;margin:0;padding:12px 15px;border-radius:12px 12px 12px 3px;overflow-wrap:anywhere}.chat-content .bubble.user{align-self:flex-end;background:#333;color:white;border-color:#333;border-radius:12px 12px 3px 12px}.chat-form button{flex:0 0 auto}.chat-form input{width:0}.top button{background:transparent;border:0}
.activity-form{display:flex;flex-direction:column;gap:22px}.activity-form label{display:flex;flex-direction:column;gap:8px}.activity-form input,.activity-form select,.activity-form textarea{width:100%;font:inherit;background:white;border:1px solid #aaa;border-radius:6px;padding:12px;min-width:0}.time-fields{display:flex;gap:12px}.time-fields label{flex:1;min-width:0}.date-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.date-heading label{text-align:center}.date-heading input{display:block;width:100%;margin-top:10px}.week{display:flex;gap:4px;margin-top:22px}.week button{flex:1;padding:8px 0;min-width:0}.week small,.week b{display:block}.week small{font-size:11px;font-weight:normal}.activity-list{border-left:1px solid #bbb;margin-left:5px;padding-left:18px}.activity-card{position:relative}.activity-card:before{content:'';position:absolute;left:-24px;top:25px;width:9px;height:9px;border-radius:50%;background:#777}.activity-card p{margin:4px 0}
.timeline-content{padding-top:0}.calendar-top{margin:0 -24px;padding:28px 20px 12px;background:#fff;border-bottom:1px solid #ddd;border-radius:0 0 28px 28px}.greeting{display:flex;align-items:center;gap:14px;margin:0 4px 26px}.profile-circle{width:48px;height:48px;flex-shrink:0;border-radius:50%;background:#e5e5e5}.greeting h2{font-size:17px;margin:0}.greeting p{font-size:13px;margin:3px 0 0}.calendar-top .week{margin:0;gap:6px}.calendar-top .week button{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px}.calendar-top .week small{color:#555;font-size:12px}.calendar-top .week b{font-size:17px;font-weight:normal;width:38px;height:38px;display:grid;place-items:center;border-radius:50%}.calendar-top .week .primary{color:#242424}.calendar-top .week .primary b{background:#333;color:white}.calendar-handle{width:40px;height:4px;background:#ddd;border-radius:4px;margin:18px auto 0}
.nav-footer{padding:10px 8px max(12px,env(safe-area-inset-bottom));flex-shrink:0}.nav-footer nav{display:flex;width:100%;gap:2px}.nav-footer nav button{flex:1;min-width:0;border:0;border-radius:0;background:transparent;color:#888;padding:6px 1px;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:10px;line-height:1.4}.nav-footer nav button span{max-width:90px}.nav-footer nav button.active{color:#222;font-weight:bold}.nav-footer nav button.active svg{stroke-width:2.2}.activities-heading{display:flex;align-items:center;justify-content:space-between;margin-top:24px}.activities-heading h2{margin:0}.activities-heading button{padding:2px 11px;font-size:23px;border:0;background:transparent}
</style></head><body><main class="phone"><header class="top"><button id="back" aria-label="ย้อนกลับ">‹</button><b id="title">วิเคราะห์เสียงร้อง</b></header><section class="content" id="content"></section><footer class="footer" id="footer"></footer><div id="modal"></div></main><script>
let state='home',seconds=0,startedAt=0,tick,wait,saved=false,messages=[];const content=document.querySelector('#content'),footer=document.querySelector('#footer');
let activities=[];try{activities=JSON.parse(localStorage.getItem('baby-activities')||'[]')}catch(e){}let selectedDate=dateKey(new Date()),draftTime='';
const baby='';
function stop(){clearInterval(tick);clearTimeout(wait)}
function render(next){stop();state=next;footer.classList.toggle('nav-footer',['timeline','development','home','doctor'].includes(state));document.querySelector('.top').style.display=(state==='loading'||state==='result'||state==='timeline')?'none':'flex';content.classList.toggle('loading-content',state==='loading');content.classList.toggle('chat-content',state==='chat');content.classList.toggle('timeline-content',state==='timeline');content.classList.toggle('home-content',state==='home'||state==='record');footer.style.display=(state==='record'||state==='loading')?'none':'flex';document.querySelector('#modal').innerHTML='';document.querySelector('#back').style.visibility=state==='home'?'hidden':'visible';document.querySelector('#title').textContent=state==='chat'?'พูดคุยกับ AI':state==='activity'?'บันทึกกิจกรรม':state==='timeline'?'กิจกรรม':state==='development'?'พัฒนาการลูก':state==='doctor'?'ปรึกษาคุณหมอ':'วิเคราะห์แพทเทิร์นเสียง';
if(state==='home'){content.innerHTML=`<div class="center"><h1>ลูกกำลังร้องเพราะอะไร?</h1><p>ฟังเสียงร้อง เพื่อเข้าใจลูก</p>${baby}<div class="home-action"><button class="mic" onclick="start()" aria-label="เริ่มวิเคราะห์เสียง"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><p>แตะเพื่อเริ่มวิเคราะห์</p></div></div>`;footer.innerHTML=navbar('home')}
if(state==='record'){content.innerHTML=`<div class="center"><h1>กำลังฟังเสียงร้อง</h1><p>วางโทรศัพท์ใกล้ลูก ในที่เงียบ</p>${baby}<div class="wave">${Array.from({length:40},(_,i)=>`<i style="--i:${i};--h:${18+(i*37%75)}px"></i>`).join('')}</div><div class="timer" id="timer">00:00</div><p>กำลังบันทึก…</p></div>`;footer.innerHTML='';content.querySelector('.center').insertAdjacentHTML('beforeend',`<div class="home-action"><button class="mic" onclick="render('loading')" aria-label="ยืนยันเสียงและวิเคราะห์"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button></div>`);updateTimer();tick=setInterval(updateTimer,250)}
if(state==='loading'){content.innerHTML='<div class="center"><div class="spinner"></div><h1>กำลังวิเคราะห์…</h1></div>';footer.innerHTML='';wait=setTimeout(()=>{saved=false;render('result')},2200)}
if(state==='result'){content.innerHTML=`<div class="center"><div class="baby-image" role="img" aria-label="พื้นที่สำหรับภาพเด็ก"></div><h1>ลูกอาจกำลังหิว</h1><div class="tag">ความมั่นใจ 80%</div><p style="font-size:13px;margin-top:16px">ลองสังเกตอาการหิวร่วมด้วย</p></div><div class="card"><h2>คำแนะนำ</h2><p>สังเกตการดูดมือหรือหันหาเต้านม และเช็กเวลาให้นม</p></div><div class="card"><h2>เช็กเพิ่มเติม</h2><p>เช็กผ้าอ้อมและความสบายตัว ลองอุ้มปลอบ</p></div>${saved?'<div class="saved">✓ บันทึกแล้ว</div>':''}<button style="width:100%;margin-top:16px" onclick="start()">วิเคราะห์อีกครั้ง</button>`;footer.innerHTML=`<button onclick="render('chat')">พูดคุยกับ AI</button><button class="primary" onclick="saveResult()" ${saved?'disabled':''}>${saved?'✓ บันทึกแล้ว':'บันทึก'}</button>`}
if(state==='development'||state==='doctor'){content.innerHTML='<h1>'+ (state==='development'?'พัฒนาการลูก':'ปรึกษาคุณหมอ')+'</h1>';footer.innerHTML=navbar(state)}if(state==='activity')renderActivity();if(state==='timeline')renderTimeline();
if(state==='chat'){content.innerHTML='<div id="messages" role="log" aria-live="polite"></div>';addBubble('อยากถามเรื่องอะไรเพิ่มเติม?',false);messages.forEach(m=>addBubble(m.text,m.user));footer.innerHTML='<form class="chat-form" onsubmit="send(event)"><input aria-label="ข้อความ" placeholder="พิมพ์ข้อความ…" autocomplete="off" required><button class="primary" aria-label="ส่งข้อความ">ส่ง</button></form>'}}

function formatElapsed(total){const sec=String(total%60).padStart(2,'0'),min=String(Math.floor(total/60)%60).padStart(2,'0'),hours=Math.floor(total/3600);return hours?String(hours).padStart(2,'0')+':'+min+':'+sec:min+':'+sec}
function updateTimer(){seconds=Math.floor((performance.now()-startedAt)/1000);document.querySelector('#timer').textContent=formatElapsed(seconds)}
function start(){seconds=0;startedAt=performance.now();messages=[];render('record')}
function dialog(title,body,left,right,fn){document.querySelector('#modal').innerHTML=`<div class="overlay"><div class="dialog"><h2>${title}</h2><p>${body}</p><div class="actions"><button onclick="closeModal()">${left}</button><button class="primary" id="confirm">${right}</button></div></div></div>`;document.querySelector('#confirm').onclick=fn}
function closeModal(){document.querySelector('#modal').innerHTML=''}
function exitRecord(){dialog('ออกจากการบันทึก?','เสียงนี้จะไม่ถูกบันทึก','บันทึกต่อ','ออกจากการบันทึก',()=>render('home'))}
function navbar(active){const items=[['timeline','หน้าแรก','<path d="m3 10 9-7 9 7v10H3z M9 20v-7h6v7"/>'],['development','พัฒนาการลูก','<path d="M4 20V12M10 20V8M16 20V4M22 20H2"/>'],['home','วิเคราะห์แพทเทิร์นเสียง','<path d="M3 10v4M7 6v12M12 3v18M17 7v10M21 10v4"/>'],['doctor','ปรึกษาคุณหมอ','<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>']];return '<nav aria-label="เมนูหลัก">'+items.map(([id,label,path])=>`<button class="${active===id?'active':''}" ${active===id?'aria-current="page"':''} onclick="render('${id}')"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg><span>${label}</span></button>`).join('')+'</nav>'}
function dateKey(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function currentTime(){return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}
function saveResult(){selectedDate=dateKey(new Date());draftTime=currentTime();render('activity')}
function renderActivity(){content.innerHTML=`<form id="activity-form" class="activity-form" onsubmit="commitActivity(event)"><label>กิจกรรม<select name="activity"><option>ให้นม</option><option>เปลี่ยนผ้าอ้อม</option><option>นอน</option><option>เล่น</option><option>อุ้มปลอบ</option><option>อื่น ๆ</option></select></label><label>วันที่<input name="date" type="date" value="${selectedDate}" required></label><div class="time-fields"><label>เริ่ม<input name="from" type="time" value="${draftTime}" required></label><label>สิ้นสุด<input name="to" type="time" value="${draftTime}" required></label></div><label>บันทึกเพิ่มเติม<textarea name="note" rows="3" placeholder="เพิ่มรายละเอียด"></textarea></label></form>`;footer.innerHTML='<button class="primary" type="submit" form="activity-form">บันทึก</button>'}
function commitActivity(event){event.preventDefault();const f=new FormData(event.target),entry={id:Date.now(),activity:f.get('activity'),date:f.get('date'),from:f.get('from'),to:f.get('to'),note:f.get('note').trim(),reason:'ลูกอาจกำลังหิว',confidence:80};const next=[...activities,entry];try{localStorage.setItem('baby-activities',JSON.stringify(next))}catch(e){dialog('บันทึกไม่ได้','ลองอีกครั้ง','กลับ','ตกลง',closeModal);return}activities=next;saved=true;selectedDate=entry.date;render('timeline')}
function shiftDate(days){const d=new Date(selectedDate+'T12:00:00+07:00');d.setDate(d.getDate()+days);selectedDate=dateKey(d);render('timeline')}
function renderTimeline(){const selected=new Date(selectedDate+'T12:00:00+07:00'),weekStart=new Date(selected);weekStart.setDate(selected.getDate()-selected.getDay());content.innerHTML=`<div class="calendar-top"><div class="greeting"><div class="profile-circle" aria-hidden="true"></div><div><h2>${new Date().getHours()<12?'สวัสดีตอนเช้า':new Date().getHours()<18?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น'},</h2><p>วันนี้เป็นอย่างไรบ้าง?</p></div></div><div class="week">${Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);const key=dateKey(d);return `<button class="${key===selectedDate?'primary':''}" onclick="selectedDate='${key}';render('timeline')"><small>${['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'][d.getDay()]}</small><b>${d.getDate()}</b></button>`}).join('')}</div><div class="calendar-handle"></div></div><div class="activities-heading"><h2>กิจกรรม</h2><button onclick="draftTime=currentTime();render('activity')" aria-label="เพิ่มกิจกรรม">+</button></div><div id="activity-list" class="activity-list"></div>`;const list=document.querySelector('#activity-list'),items=activities.filter(a=>a.date===selectedDate).sort((a,b)=>a.from.localeCompare(b.from)||a.id-b.id);if(!items.length)list.innerHTML='<p class="center">ยังไม่มีกิจกรรม</p>';items.forEach(a=>{const card=document.createElement('article');card.className='card activity-card';const title=document.createElement('h2');title.textContent=a.activity;const time=document.createElement('p');time.textContent=a.from===a.to?a.from+' น.':a.from+' – '+a.to+' น.';card.append(title,time);if(a.note){const note=document.createElement('p');note.textContent=a.note;card.append(note)}list.append(card)});footer.innerHTML=navbar('timeline')}

function addBubble(text,user){let b=document.createElement('div');b.className='bubble'+(user?' user':'');b.textContent=text;document.querySelector('#messages').append(b);content.scrollTop=content.scrollHeight}
function send(e){e.preventDefault();let input=e.target.querySelector('input'),text=input.value.trim();if(!text)return;messages.push({text,user:true});addBubble(text,true);input.value='';let answer=messages.filter(m=>m.user).length===1?'ลูกมีอาการอะไรเพิ่มเติมบ้าง เล่าให้ฟังได้เลยค่ะ':'รับทราบค่ะ มีอะไรอยากถามเพิ่มเติมไหม?';messages.push({text:answer,user:false});addBubble(answer,false)}
document.querySelector('#back').onclick=()=>{if(state==='activity')render(saved?'timeline':'result');else if(state==='timeline')render('home');else if(state==='record')exitRecord();else if(state==='chat')render('result');else if(state==='result'&&!saved)dialog('ออกโดยไม่บันทึกผล?','ผลตัวอย่างนี้ยังไม่ได้บันทึก','กลับไปบันทึก','ออกโดยไม่บันทึก',()=>render('home'));else render('home')};render('timeline');
</script></body></html>
